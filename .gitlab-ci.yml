stages:
  - build
  - checks

variables:
  BUILD_SECRETS: |
    npm_token=$NPM_TOKEN

  # [TODO] добавить свой base path (без кавычек) для продукта
  BUILD_ARGS: |
    BASE_IMAGE=$BASE_IMAGE_UBUNTU24_SPA
    BASE_PATH=[TODO]

include:
  - project: uchiru/ci/shared
    ref: master
    file: stages/build-and-push.yml

# Аудит зависимостей на pnpm (шаблон content-0-4-configs завязан на yarn@1 — не используем).
# pnpm audit читает pnpm-lock.yaml и ходит за данными в реестр уязвимостей через https_proxy.
audit:
  stage: checks
  image: node:24.18.0-alpine
  script:
    - npm install -g pnpm@11.15.1
    - pnpm audit --prod --audit-level=high
  # Консультативно: не ломаем пайплайн при найденных уязвимостях.
  # Поменяйте на false, если аудит должен блокировать релиз.
  allow_failure: true
